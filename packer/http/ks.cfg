# AlmaLinux 9 Automated Kickstart (64 GB CIS Level 2 Partitioning & Minimal Install)
text
reboot
url --url https://repo.almalinux.org/almalinux/9/BaseOS/x86_64/os/

lang en_US.UTF-8
keyboard us
timezone UTC --utc

# Network configuration (DHCP for initial build, IPv6 disabled)
network --bootproto=dhcp --device=link --activate --onboot=on --noipv6 --hostname=almalinux9-template.jnet.lan

# 32 GB CIS Level 2 Partition Layout
zerombr
clearpart --all --initlabel
part /boot --fstype="xfs" --size=1024
part pv.01 --fstype="lvmpv" --grow --size=1

volgroup almalinux pv.01
logvol / --vgname=almalinux --name=root --size=10240 --fstype=xfs
logvol swap --vgname=almalinux --name=swap --size=2048 --fstype=swap
logvol /tmp --vgname=almalinux --name=tmp --size=1024 --fstype=xfs --fsoptions="nodev,nosuid,noexec"
logvol /var/log/audit --vgname=almalinux --name=var_log_audit --size=2048 --fstype=xfs --fsoptions="nodev,nosuid,noexec"
logvol /var --vgname=almalinux --name=var --size=5120 --fstype=xfs --fsoptions="nodev"
logvol /var/log --vgname=almalinux --name=var_log --size=3072 --fstype=xfs --fsoptions="nodev,nosuid,noexec"
logvol /var/tmp --vgname=almalinux --name=var_tmp --size=1024 --fstype=xfs --fsoptions="nodev,nosuid,noexec"
logvol /home --vgname=almalinux --name=home --size=2048 --fstype=xfs --fsoptions="nodev,nosuid"

# Security & SELinux
selinux --enforcing
firewall --enabled --ssh

# User setup
rootpw --lock
user --name=almalinux --plaintext --password=PackerBuildTempPass123! --groups=wheel

# Minimal Install Package Selection
%packages --inst-langs=en
@core
qemu-guest-agent
cloud-init
cloud-utils-growpart
curl
jq
libcap
unzip
tar
procps-ng
sudo
policycoreutils-python-utils
firewalld
openssh-server
-cockpit
-rdate
%end

%post --log=/root/ks-post.log
echo "almalinux ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers.d/almalinux
chmod 0440 /etc/sudoers.d/almalinux

systemctl enable qemu-guest-agent
systemctl enable cloud-init
systemctl enable firewalld
systemctl enable sshd
systemctl disable kdump || true
%end

%addon com_redhat_kdump --disable
%end
