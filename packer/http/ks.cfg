# AlmaLinux 9 Automated Kickstart (CIS Level 2 Partitioning & Base Setup)
text
reboot
url --url https://repo.almalinux.org/almalinux/9/BaseOS/x86_64/os/

lang en_US.UTF-8
keyboard us
timezone UTC --utc

# Network configuration (DHCP for initial build)
network --bootproto=dhcp --device=link --activate --onboot=on

# CIS Level 2 Standard Partition Layout (Separate /tmp, /var, /var/log, /var/log/audit, /home)
zerombr
clearpart --all --initlabel
part /boot --fstype="xfs" --size=1024
part pv.01 --fstype="lvmpv" --grow --size=1

volgroup vg_root pv.01
logvol / --vgname=vg_root --name=lv_root --size=6144 --fstype=xfs
logvol /tmp --vgname=vg_root --name=lv_tmp --size=1024 --fstype=xfs --fsoptions="nodev,nosuid,noexec"
logvol /var --vgname=vg_root --name=lv_var --size=3072 --fstype=xfs --fsoptions="nodev"
logvol /var/log --vgname=vg_root --name=lv_var_log --size=2048 --fstype=xfs --fsoptions="nodev,nosuid,noexec"
logvol /var/log/audit --vgname=vg_root --name=lv_var_log_audit --size=1024 --fstype=xfs --fsoptions="nodev,nosuid,noexec"
logvol /var/tmp --vgname=vg_root --name=lv_var_tmp --size=1024 --fstype=xfs --fsoptions="nodev,nosuid,noexec"
logvol /home --vgname=vg_root --name=lv_home --size=2048 --fstype=xfs --fsoptions="nodev,nosuid"

# Security & SELinux
selinux --enforcing
firewall --enabled --ssh

# User setup
rootpw --lock
user --name=almalinux --plaintext --password=PackerBuildTempPass123! --groups=wheel

# Package Selection
%packages --inst-langs=en
@core
qemu-guest-agent
cloud-init
cloud-utils-growpart
curl
jq
libcap
unzip
tar
procps-ng
sudo
policycoreutils-python-utils
firewalld
openssh-server
-cockpit
-rdate
%end

%post --log=/root/ks-post.log
echo "almalinux ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers.d/almalinux
chmod 0440 /etc/sudoers.d/almalinux

systemctl enable qemu-guest-agent
systemctl enable cloud-init
systemctl enable firewalld
systemctl enable sshd
%end
