stages:
  - validate
  - build_image
  - plan
  - apply
  - configure
  - rolling_repave
  - verify

variables:
  TF_ROOT: "${CI_PROJECT_DIR}/terraform"
  TF_ADDRESS: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/vault-production"
  TF_IN_AUTOMATION: "true"
  ANSIBLE_ROOT: "${CI_PROJECT_DIR}/ansible"
  ANSIBLE_FORCE_COLOR: "true"
  PACKER_ROOT: "${CI_PROJECT_DIR}/packer"

default:
  tags:
    - gitlab-runner

# -------------------------------------------------------------------
# Stage: Validate & Linting
# -------------------------------------------------------------------
terraform:validate:
  stage: validate
  image: hashicorp/terraform:1.8.5
  before_script:
    - cd ${TF_ROOT}
    - terraform init -backend=false
  script:
    - terraform fmt -check
    - terraform validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

ansible:lint:
  stage: validate
  image: cytopia/ansible-lint:latest
  before_script:
    - cd ${ANSIBLE_ROOT}
  script:
    - ansible-playbook --syntax-check playbooks/site.yaml
    - ansible-playbook --syntax-check playbooks/rolling_update.yaml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# -------------------------------------------------------------------
# Stage: Packer Golden Image Build (Manual or Scheduled Weekly)
# -------------------------------------------------------------------
packer:build:
  stage: build_image
  image: hashicorp/packer:1.10.3
  before_script:
    - cd ${PACKER_ROOT}
    - packer init almalinux9-cis.pkr.hcl
  script:
    - |
      packer build \
        -var "proxmox_url=${TF_VAR_pve_host_1_endpoint}api2/json" \
        -var "proxmox_token_id=${TF_VAR_pve_host_1_api_token}" \
        almalinux9-cis.pkr.hcl
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true

# -------------------------------------------------------------------
# Stage: Terraform Plan
# -------------------------------------------------------------------
terraform:plan:
  stage: plan
  image: hashicorp/terraform:1.8.5
  before_script:
    - cd ${TF_ROOT}
    - terraform init \
        -backend-config="address=${TF_ADDRESS}" \
        -backend-config="lock_address=${TF_ADDRESS}/lock" \
        -backend-config="unlock_address=${TF_ADDRESS}/lock" \
        -backend-config="username=gitlab-ci-token" \
        -backend-config="password=${CI_JOB_TOKEN}" \
        -backend-config="lock_method=POST" \
        -backend-config="unlock_method=DELETE" \
        -backend-config="retry_wait_min=5"
  script:
    - terraform plan -out=tfplan -input=false
  artifacts:
    name: "plan-${CI_COMMIT_SHA}"
    paths:
      - ${TF_ROOT}/tfplan
      - ${TF_ROOT}/.terraform.lock.hcl
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# -------------------------------------------------------------------
# Stage: Terraform Apply
# -------------------------------------------------------------------
terraform:apply:
  stage: apply
  image: hashicorp/terraform:1.8.5
  before_script:
    - cd ${TF_ROOT}
    - terraform init \
        -backend-config="address=${TF_ADDRESS}" \
        -backend-config="lock_address=${TF_ADDRESS}/lock" \
        -backend-config="unlock_address=${TF_ADDRESS}/lock" \
        -backend-config="username=gitlab-ci-token" \
        -backend-config="password=${CI_JOB_TOKEN}" \
        -backend-config="lock_method=POST" \
        -backend-config="unlock_method=DELETE" \
        -backend-config="retry_wait_min=5"
  script:
    - terraform apply -input=false tfplan
  artifacts:
    name: "inventory-${CI_COMMIT_SHA}"
    paths:
      - ${ANSIBLE_ROOT}/inventory/hosts.yaml
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"

# -------------------------------------------------------------------
# Stage: Ansible Initial Configuration Management
# -------------------------------------------------------------------
ansible:configure:
  stage: configure
  image: alpine/ansible:latest
  before_script:
    - apk add --no-cache openssh-client openssl jq curl
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    - cd ${ANSIBLE_ROOT}
  script:
    - ansible-playbook -i inventory/hosts.yaml playbooks/site.yaml
  artifacts:
    name: "vault-credentials-${CI_COMMIT_SHA}"
    paths:
      - credentials/
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"

# -------------------------------------------------------------------
# Stage: Zero-Downtime Rolling Repave (Method A)
# -------------------------------------------------------------------
ansible:rolling_repave:
  stage: rolling_repave
  image: alpine/ansible:latest
  before_script:
    - apk add --no-cache openssh-client openssl jq curl
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    - cd ${ANSIBLE_ROOT}
  script:
    - ansible-playbook -i inventory/hosts.yaml playbooks/rolling_update.yaml
  artifacts:
    name: "vault-backup-${CI_COMMIT_SHA}"
    paths:
      - credentials/backups/
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true

# -------------------------------------------------------------------
# Stage: Verification & Cluster Health
# -------------------------------------------------------------------
vault:verify:
  stage: verify
  image: alpine:latest
  before_script:
    - apk add --no-cache curl jq
  script:
    - echo "Executing Vault cluster health check across active nodes..."
    - |
      for ip in 192.169.0.201 192.169.0.202 192.169.0.203; do
        echo "Querying Node ${ip}:8200..."
        curl -k -s "https://${ip}:8200/v1/sys/health" | jq . || true
      done
    - echo "Checking Transit Auto-Unseal Node 192.169.0.200:8200..."
    - curl -k -s "https://192.169.0.200:8200/v1/sys/health" | jq . || true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
