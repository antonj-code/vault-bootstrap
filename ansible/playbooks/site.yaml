---
# Step 0: Ensure all nodes (VMs and Transit LXC) are online and reachable via SSH
- name: Wait for all nodes to become reachable via SSH
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for SSH connectivity
      ansible.builtin.wait_for_connection:
        delay: 3
        timeout: 180

# Step 1: Base system setup & directory layout on all nodes
- name: Prepare base OS and install HashiCorp Vault on all nodes
  hosts: all
  gather_facts: true
  roles:
    - role: vault_common

# Step 2: PKI and TLS certificate generation & distribution
- name: Generate and distribute TLS certificates for all nodes
  hosts: all
  gather_facts: false
  roles:
    - role: vault_pki

# Step 3: Deploy, initialize, and configure Transit Auto-Unseal Vault
- name: Configure and bootstrap Transit Auto-Unseal Vault LXC
  hosts: vault_transit
  gather_facts: false
  roles:
    - role: vault_transit

# Step 4: Deploy, initialize, and join Main Vault 3-Node Raft Cluster
- name: Configure and bootstrap Main Vault 3-Node Raft Cluster
  hosts: vault_cluster
  gather_facts: false
  roles:
    - role: vault_cluster

# Step 5: Post-deployment cluster verification
- name: Verify overall cluster health across all instances
  hosts: all
  gather_facts: false
  tasks:
    - name: Run Vault health check
      ansible.builtin.command:
        cmd: "vault status -format=json"
      environment:
        VAULT_ADDR: "https://127.0.0.1:{{ vault_api_port }}"
        VAULT_CACERT: "{{ vault_tls_dir }}/ca.crt"
      register: health_status_raw
      failed_when: health_status_raw.rc not in [0, 2]
      changed_when: false

    - name: Display instance health summary
      ansible.builtin.debug:
        msg: >
          Node {{ inventory_hostname }} ({{ ansible_host }}):
          Initialized={{ (health_status_raw.stdout | from_json).initialized }},
          Sealed={{ (health_status_raw.stdout | from_json).sealed }},
          HA Enabled={{ (health_status_raw.stdout | from_json).ha_enabled | default(false) }},
          Mode={{ 'Standby' if (health_status_raw.stdout | from_json).is_self | default(false) == false else 'Active/Transit' }}
