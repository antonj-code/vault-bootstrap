---
# ==============================================================================
# Zero-Downtime Rolling Update & Repave Playbook (Method A: Raft Log Sync)
# Executes sequential repaving across nodes while maintaining 2/3 Raft Quorum
# ==============================================================================

- name: Pre-flight Raft Snapshot & Quorum Verification
  hosts: vm-vault-01
  gather_facts: false
  tasks:
    - name: Load Cluster root token
      ansible.builtin.set_fact:
        cluster_root_token: "{{ ((lookup('file', vault_local_credentials_dir + '/cluster_credentials.json') | from_json).root_token) }}"

    - name: Verify cluster health and quorum before repaving
      ansible.builtin.command:
        cmd: "{{ vault_bin }} operator raft list-peers -format=json"
      environment:
        VAULT_ADDR: "https://127.0.0.1:{{ vault_api_port }}"
        VAULT_CACERT: "{{ vault_tls_dir }}/ca.crt"
        VAULT_TOKEN: "{{ cluster_root_token }}"
      register: initial_peers_raw
      failed_when: (initial_peers_raw.stdout | from_json).data.config.servers | length < 3
      changed_when: false

    - name: Take pre-repave automated Raft backup snapshot
      ansible.builtin.command:
        cmd: "{{ vault_bin }} operator raft snapshot save /tmp/pre-repave.snap"
      environment:
        VAULT_ADDR: "https://127.0.0.1:{{ vault_api_port }}"
        VAULT_CACERT: "{{ vault_tls_dir }}/ca.crt"
        VAULT_TOKEN: "{{ cluster_root_token }}"

    - name: Fetch Raft snapshot to control node
      ansible.builtin.fetch:
        src: "/tmp/pre-repave.snap"
        dest: "{{ vault_local_credentials_dir }}/backups/raft-pre-repave-{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}.snap"
        flat: true

    - name: Display pre-flight confirmation
      ansible.builtin.debug:
        msg: "Pre-flight backup succeeded. All 3 Raft peers online. Proceeding with rolling repave."

# ------------------------------------------------------------------------------
# Sequential Rolling Node Repave (One Node at a Time)
# Order: Standby 3 (guardian) -> Standby 2 (colossus) -> Leader 1 (colossus)
# ------------------------------------------------------------------------------
- name: Execute Rolling Node Repave
  hosts: vault_cluster
  serial: 1
  gather_facts: true
  roles:
    - role: vault_common
    - role: vault_pki
    - role: vault_cluster

  post_tasks:
    - name: Step down if node is currently the active leader
      ansible.builtin.command:
        cmd: "{{ vault_bin }} operator step-down"
      environment:
        VAULT_ADDR: "https://127.0.0.1:{{ vault_api_port }}"
        VAULT_CACERT: "{{ vault_tls_dir }}/ca.crt"
        VAULT_TOKEN: "{{ ((lookup('file', vault_local_credentials_dir + '/cluster_credentials.json') | from_json).root_token) }}"
      register: stepdown_res
      failed_when: false
      changed_when: stepdown_res.rc == 0

    - name: Restart Vault service on repaved node
      ansible.builtin.systemd:
        name: vault
        state: restarted

    - name: Wait for repaved node API to become responsive
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ vault_api_port }}"
        delay: 3
        timeout: 45

    - name: Wait for node to auto-unseal via Transit and sync Raft log
      ansible.builtin.uri:
        url: "https://127.0.0.1:{{ vault_api_port }}/v1/sys/health"
        ca_path: "{{ vault_tls_dir }}/ca.crt"
        method: GET
        status_code: [200, 429, 472, 473]
        return_content: true
      register: node_status_raw
      retries: 15
      delay: 5
      until: node_status_raw.status in [200, 429] and not node_status_raw.json.sealed

    - name: Verify full 3-node Raft consensus health before proceeding to next node
      ansible.builtin.command:
        cmd: "{{ vault_bin }} operator raft list-peers -format=json"
      environment:
        VAULT_ADDR: "https://127.0.0.1:{{ vault_api_port }}"
        VAULT_CACERT: "{{ vault_tls_dir }}/ca.crt"
        VAULT_TOKEN: "{{ ((lookup('file', vault_local_credentials_dir + '/cluster_credentials.json') | from_json).root_token) }}"
      register: peer_check_raw
      retries: 10
      delay: 5
      until: (peer_check_raw.stdout | from_json).data.config.servers | length >= 3
      changed_when: false

    - name: Confirm node health
      ansible.builtin.debug:
        msg: "Node {{ inventory_hostname }} successfully repaved, unsealed, and verified in Raft consensus."

# ------------------------------------------------------------------------------
# Final Cluster Validation
# ------------------------------------------------------------------------------
- name: Post-Repaving Health Verification
  hosts: all
  gather_facts: false
  tasks:
    - name: Query health status
      ansible.builtin.uri:
        url: "https://127.0.0.1:{{ vault_api_port }}/v1/sys/health"
        ca_path: "{{ vault_tls_dir }}/ca.crt"
        method: GET
        status_code: [200, 429, 472, 473]
        return_content: true
      register: final_status_raw

    - name: Output summary
      ansible.builtin.debug:
        msg: "Repave Complete: {{ inventory_hostname }} is Sealed={{ final_status_raw.json.sealed }}"
