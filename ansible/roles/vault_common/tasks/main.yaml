---
# --- Multi-Distribution Package Installation ---
- name: Install dependencies on RedHat / AlmaLinux family
  ansible.builtin.dnf:
    name:
      - ca-certificates
      - curl
      - gnupg2
      - jq
      - libcap
      - unzip
      - tar
      - procps-ng
      - sudo
      - policycoreutils-python-utils
      - firewalld
    state: present
  when: ansible_os_family == 'RedHat'

- name: Install dependencies on Debian / Ubuntu family
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - jq
      - libcap2-bin
      - unzip
      - tar
      - procps
      - sudo
    state: present
  when: ansible_os_family == 'Debian'

# --- Firewall Configuration (AlmaLinux / RHEL with CIS Benchmark) ---
- name: Ensure firewalld is started and enabled
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true
  when: ansible_os_family == 'RedHat' and ansible_virtualization_type != 'lxc'

- name: Open Vault API and Cluster ports in firewalld
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop:
    - "{{ vault_api_port }}/tcp"
    - "{{ vault_cluster_port }}/tcp"
  when: ansible_os_family == 'RedHat' and ansible_virtualization_type != 'lxc'

# --- Kernel & Sysctl Hardening ---
- name: Configure sysctl optimizations for Vault
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: true
  loop:
    - { name: 'vm.swappiness', value: '1' }
    - { name: 'vm.max_map_count', value: '262144' }
    - { name: 'net.core.somaxconn', value: '4096' }
  when: ansible_virtualization_type != 'lxc'

# --- Vault User & Directory Layout ---
- name: Create vault system group
  ansible.builtin.group:
    name: "{{ vault_group }}"
    state: present
    system: true

- name: Create vault system user (CIS compliant nologin shell)
  ansible.builtin.user:
    name: "{{ vault_user }}"
    group: "{{ vault_group }}"
    home: "/opt/vault"
    shell: "/sbin/nologin"
    system: true
    state: present

- name: Create required Vault directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ vault_user }}"
    group: "{{ vault_group }}"
    mode: '0750'
  loop:
    - "{{ vault_config_dir }}"
    - "{{ vault_tls_dir }}"
    - "/opt/vault"
    - "{{ vault_data_dir }}"
    - "{{ vault_log_dir }}"

# --- Vault Binary Installation ---
- name: Check if Vault binary is already installed
  ansible.builtin.stat:
    path: "/usr/local/bin/vault"
  register: vault_bin_stat

- name: Download and install HashiCorp Vault binary
  when: not vault_bin_stat.stat.exists
  block:
    - name: Download Vault zip archive
      ansible.builtin.get_url:
        url: "https://releases.hashicorp.com/vault/{{ vault_version }}/vault_{{ vault_version }}_linux_amd64.zip"
        dest: "/tmp/vault_{{ vault_version }}_linux_amd64.zip"
        mode: '0644'

    - name: Extract Vault binary
      ansible.builtin.unarchive:
        src: "/tmp/vault_{{ vault_version }}_linux_amd64.zip"
        dest: "/usr/local/bin"
        remote_src: true
        owner: "root"
        group: "root"
        mode: '0755'

    - name: Remove temporary zip archive
      ansible.builtin.file:
        path: "/tmp/vault_{{ vault_version }}_linux_amd64.zip"
        state: absent

# --- SELinux & Linux Capabilities Hardening ---
- name: Configure SELinux file contexts on RedHat / AlmaLinux
  when: ansible_os_family == 'RedHat' and ansible_virtualization_type != 'lxc'
  block:
    - name: Set SELinux file context for /usr/local/bin/vault
      community.general.sefcontext:
        target: '/usr/local/bin/vault'
        setype: bin_t
        state: present

    - name: Set SELinux file context for /opt/vault
      community.general.sefcontext:
        target: '/opt/vault(/.*)?'
        setype: var_lib_t
        state: present

    - name: Apply SELinux context changes (restorecon)
      ansible.builtin.command:
        cmd: restorecon -Rv /usr/local/bin/vault /opt/vault {{ vault_config_dir }}
      changed_when: false

- name: Grant Vault binary IPC_LOCK capability
  ansible.builtin.capabilities:
    path: "/usr/local/bin/vault"
    capability: cap_ipc_lock=+ep
    state: present
  when: ansible_virtualization_type != 'lxc'

# --- Systemd Service & CLI Profile ---
- name: Deploy Vault systemd service unit
  ansible.builtin.template:
    src: vault.service.j2
    dest: /etc/systemd/system/vault.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd daemon
    - Restart vault

- name: Setup environment variable profile for CLI access
  ansible.builtin.copy:
    dest: /etc/profile.d/vault.sh
    content: |
      export VAULT_ADDR="https://127.0.0.1:{{ vault_api_port }}"
      export VAULT_CACERT="{{ vault_tls_dir }}/ca.crt"
    owner: root
    group: root
    mode: '0644'
