---
- name: Read Auto-Unseal token from control node
  ansible.builtin.set_fact:
    transit_unseal_token: "{{ lookup('file', vault_local_credentials_dir + '/autounseal_token.txt') | trim }}"

- name: Render Main Vault cluster configuration
  ansible.builtin.template:
    src: vault-cluster.hcl.j2
    dest: "{{ vault_config_dir }}/vault.hcl"
    owner: "{{ vault_user }}"
    group: "{{ vault_group }}"
    mode: '0640'
  notify: Restart vault

- name: Flush handlers to apply configuration
  ansible.builtin.meta: flush_handlers

- name: Ensure Vault cluster service is started and enabled
  ansible.builtin.systemd:
    name: vault
    state: started
    enabled: true

- name: Wait for Vault cluster API to become reachable
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ vault_api_port }}"
    delay: 2
    timeout: 30

- name: Bootstrap cluster on Primary Node
  when: inventory_hostname == vault_primary_node
  block:
    - name: Check Primary Node initialization status via HTTP API
      ansible.builtin.uri:
        url: "https://127.0.0.1:{{ vault_api_port }}/v1/sys/init"
        ca_path: "{{ vault_tls_dir }}/ca.crt"
        method: GET
        status_code: [200]
        return_content: true
      register: primary_init_check
      retries: 15
      delay: 2
      until: primary_init_check.status == 200

    - name: Initialize Main Vault cluster
      when: not primary_init_check.json.initialized
      ansible.builtin.command:
        cmd: "{{ vault_bin }} operator init -recovery-shares={{ vault_recovery_shares }} -recovery-threshold={{ vault_recovery_threshold }} -format=json"
      environment:
        VAULT_ADDR: "https://127.0.0.1:{{ vault_api_port }}"
        VAULT_CACERT: "{{ vault_tls_dir }}/ca.crt"
      register: cluster_init_raw

    - name: Save Cluster recovery keys and initial root token to control node
      when: not primary_init_check.json.initialized
      ansible.builtin.copy:
        content: "{{ cluster_init_raw.stdout }}"
        dest: "{{ vault_local_credentials_dir }}/cluster_credentials.json"
        mode: '0600'
      delegate_to: localhost
      become: false

- name: Wait for standby nodes to auto-join Raft cluster
  ansible.builtin.pause:
    seconds: 10
  when: inventory_hostname == vault_primary_node

- name: Check if cluster credentials exist on control node
  ansible.builtin.stat:
    path: "{{ vault_local_credentials_dir }}/cluster_credentials.json"
  delegate_to: localhost
  become: false
  register: cluster_creds_stat
  when: inventory_hostname == vault_primary_node

- name: Validate Raft cluster leader state via HTTP API
  when: inventory_hostname == vault_primary_node
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ vault_api_port }}/v1/sys/leader"
    ca_path: "{{ vault_tls_dir }}/ca.crt"
    method: GET
    status_code: [200]
    return_content: true
  register: cluster_leader_status
  retries: 12
  delay: 3
  until: cluster_leader_status.status == 200 and ((cluster_leader_status.json.leader_address | default('') | length > 0) or (cluster_leader_status.json.is_self | default(false)))

- name: Validate Raft cluster peer membership if root token is available
  when: inventory_hostname == vault_primary_node and (cluster_creds_stat.stat.exists | default(false))
  block:
    - name: Load Cluster root token
      ansible.builtin.set_fact:
        cluster_root_token: "{{ ((lookup('file', vault_local_credentials_dir + '/cluster_credentials.json') | from_json).root_token) }}"

    - name: Query Raft cluster peer list
      ansible.builtin.command:
        cmd: "{{ vault_bin }} operator raft list-peers -format=json"
      environment:
        VAULT_ADDR: "https://127.0.0.1:{{ vault_api_port }}"
        VAULT_CACERT: "{{ vault_tls_dir }}/ca.crt"
        VAULT_TOKEN: "{{ cluster_root_token }}"
      register: raft_peers_raw
      retries: 6
      delay: 5
      until: (raft_peers_raw.stdout | from_json).data.config.servers | length >= 3
      changed_when: false

    - name: Display Raft cluster peer details
      ansible.builtin.debug:
        msg: "Active Raft Peers: {{ (raft_peers_raw.stdout | from_json).data.config.servers }}"

- name: Create bootstrap sentinel marker file on cluster node
  ansible.builtin.file:
    path: "{{ vault_bootstrap_marker | default('/etc/vault.d/.vault_bootstrapped') }}"
    state: touch
    owner: "{{ vault_user }}"
    group: "{{ vault_group }}"
    mode: '0640'
