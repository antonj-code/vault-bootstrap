---
- name: Ensure local credentials directory exists on control node
  ansible.builtin.file:
    path: "{{ vault_local_credentials_dir }}/tls"
    state: directory
    mode: '0700'
  delegate_to: localhost
  become: false
  run_once: true

- name: Identify surviving bootstrapped nodes
  ansible.builtin.set_fact:
    bootstrapped_survivor: >-
      {{
        (groups['all']
        | map('extract', hostvars)
        | selectattr('is_vault_bootstrapped', 'defined')
        | selectattr('is_vault_bootstrapped', 'equalto', true)
        | map(attribute='inventory_hostname')
        | list
        | first)
        | default('')
      }}
  run_once: true

- name: Check if CA key exists on surviving node
  ansible.builtin.stat:
    path: "{{ vault_tls_dir }}/ca.key"
  delegate_to: "{{ bootstrapped_survivor if (bootstrapped_survivor | default('') | length > 0) else inventory_hostname }}"
  register: existing_ca_key_on_survivor
  run_once: true
  ignore_errors: true
  when: bootstrapped_survivor | default('') | length > 0

- name: Fetch existing Root CA key and cert from surviving node
  when: (bootstrapped_survivor | default('') | length > 0) and (existing_ca_key_on_survivor.stat.exists | default(false))
  block:
    - name: Fetch existing CA key
      ansible.builtin.slurp:
        src: "{{ vault_tls_dir }}/ca.key"
      delegate_to: "{{ bootstrapped_survivor if (bootstrapped_survivor | default('') | length > 0) else inventory_hostname }}"
      register: slurped_ca_key

    - name: Fetch existing CA cert
      ansible.builtin.slurp:
        src: "{{ vault_tls_dir }}/ca.crt"
      delegate_to: "{{ bootstrapped_survivor if (bootstrapped_survivor | default('') | length > 0) else inventory_hostname }}"
      register: slurped_ca_cert

    - name: Write existing CA key to control node
      ansible.builtin.copy:
        content: "{{ slurped_ca_key.content | b64decode }}"
        dest: "{{ vault_local_credentials_dir }}/tls/ca.key"
        mode: '0600'
      delegate_to: localhost
      become: false

    - name: Write existing CA cert to control node
      ansible.builtin.copy:
        content: "{{ slurped_ca_cert.content | b64decode }}"
        dest: "{{ vault_local_credentials_dir }}/tls/ca.crt"
        mode: '0644'
      delegate_to: localhost
      become: false
  run_once: true

- name: Generate Root CA private key on control node if not present
  ansible.builtin.command:
    cmd: "openssl genrsa -out {{ vault_local_credentials_dir }}/tls/ca.key 4096"
    creates: "{{ vault_local_credentials_dir }}/tls/ca.key"
  delegate_to: localhost
  become: false
  run_once: true

- name: Generate Root CA certificate on control node if not present
  ansible.builtin.command:
    cmd: >
      openssl req -x509 -new -nodes -key {{ vault_local_credentials_dir }}/tls/ca.key
      -sha256 -days {{ pki_ca_validity_days }}
      -subj "{{ pki_ca_subject }}"
      -out {{ vault_local_credentials_dir }}/tls/ca.crt
    creates: "{{ vault_local_credentials_dir }}/tls/ca.crt"
  delegate_to: localhost
  become: false
  run_once: true

- name: Backup Root CA key to all nodes for future node expansion / disaster recovery
  ansible.builtin.copy:
    src: "{{ vault_local_credentials_dir }}/tls/ca.key"
    dest: "{{ vault_tls_dir }}/ca.key"
    owner: "{{ vault_user }}"
    group: "{{ vault_group }}"
    mode: '0600'

- name: Issue TLS certificate for new nodes
  when: is_vault_new_node | default(true)
  block:
    - name: Generate private key for node on control node
      ansible.builtin.command:
        cmd: "openssl genrsa -out {{ vault_local_credentials_dir }}/tls/{{ inventory_hostname }}.key 2048"
        creates: "{{ vault_local_credentials_dir }}/tls/{{ inventory_hostname }}.key"
      delegate_to: localhost
      become: false

    - name: Create OpenSSL SAN config for node on control node
      ansible.builtin.copy:
        dest: "{{ vault_local_credentials_dir }}/tls/{{ inventory_hostname }}.cnf"
        mode: '0600'
        content: |
          [req]
          default_bits = 2048
          prompt = no
          default_md = sha256
          distinguished_name = dn
          req_extensions = req_ext

          [dn]
          C = US
          O = JNET-Labs
          OU = Vault-Control
          CN = {{ inventory_hostname }}.{{ vault_domain }}

          [req_ext]
          subjectAltName = @alt_names

          [alt_names]
          DNS.1 = {{ inventory_hostname }}
          DNS.2 = {{ inventory_hostname }}.{{ vault_domain }}
          DNS.3 = vault.{{ vault_domain }}
          DNS.4 = localhost
          IP.1 = 127.0.0.1
          IP.2 = {{ ansible_host }}
      delegate_to: localhost
      become: false

    - name: Generate CSR for node on control node
      ansible.builtin.command:
        cmd: >
          openssl req -new
          -key {{ vault_local_credentials_dir }}/tls/{{ inventory_hostname }}.key
          -out {{ vault_local_credentials_dir }}/tls/{{ inventory_hostname }}.csr
          -config {{ vault_local_credentials_dir }}/tls/{{ inventory_hostname }}.cnf
        creates: "{{ vault_local_credentials_dir }}/tls/{{ inventory_hostname }}.csr"
      delegate_to: localhost
      become: false

    - name: Sign node certificate with Root CA on control node
      ansible.builtin.command:
        cmd: >
          openssl x509 -req
          -in {{ vault_local_credentials_dir }}/tls/{{ inventory_hostname }}.csr
          -CA {{ vault_local_credentials_dir }}/tls/ca.crt
          -CAkey {{ vault_local_credentials_dir }}/tls/ca.key
          -CAcreateserial
          -out {{ vault_local_credentials_dir }}/tls/{{ inventory_hostname }}.crt
          -days {{ pki_cert_validity_days }}
          -sha256
          -extfile {{ vault_local_credentials_dir }}/tls/{{ inventory_hostname }}.cnf
          -extensions req_ext
        creates: "{{ vault_local_credentials_dir }}/tls/{{ inventory_hostname }}.crt"
      delegate_to: localhost
      become: false

    - name: Distribute node TLS certificate
      ansible.builtin.copy:
        src: "{{ vault_local_credentials_dir }}/tls/{{ inventory_hostname }}.crt"
        dest: "{{ vault_tls_dir }}/vault.crt"
        owner: "{{ vault_user }}"
        group: "{{ vault_group }}"
        mode: '0644'

    - name: Distribute node TLS private key
      ansible.builtin.copy:
        src: "{{ vault_local_credentials_dir }}/tls/{{ inventory_hostname }}.key"
        dest: "{{ vault_tls_dir }}/vault.key"
        owner: "{{ vault_user }}"
        group: "{{ vault_group }}"
        mode: '0600'

    - name: Distribute CA certificate to new node
      ansible.builtin.copy:
        src: "{{ vault_local_credentials_dir }}/tls/ca.crt"
        dest: "{{ vault_tls_dir }}/ca.crt"
        owner: "{{ vault_user }}"
        group: "{{ vault_group }}"
        mode: '0644'

    - name: Install CA certificate in Debian system trust store
      ansible.builtin.copy:
        src: "{{ vault_local_credentials_dir }}/tls/ca.crt"
        dest: "/usr/local/share/ca-certificates/vault-ca.crt"
        owner: root
        group: root
        mode: '0644'
      when: ansible_facts['os_family'] == 'Debian'
      register: ca_trust_install_debian

    - name: Update system CA certificates (Debian)
      ansible.builtin.command: update-ca-certificates
      when: ansible_facts['os_family'] == 'Debian' and ca_trust_install_debian.changed

    - name: Install CA certificate in RedHat / AlmaLinux trust store
      ansible.builtin.copy:
        src: "{{ vault_local_credentials_dir }}/tls/ca.crt"
        dest: "/etc/pki/ca-trust/source/anchors/vault-ca.crt"
        owner: root
        group: root
        mode: '0644'
      when: ansible_facts['os_family'] == 'RedHat'
      register: ca_trust_install_redhat

    - name: Update system CA certificates (RedHat / AlmaLinux)
      ansible.builtin.command: update-ca-trust extract
      when: ansible_facts['os_family'] == 'RedHat' and ca_trust_install_redhat.changed
