---
- name: Render Transit Vault configuration
  ansible.builtin.template:
    src: vault-transit.hcl.j2
    dest: "{{ vault_config_dir }}/vault.hcl"
    owner: "{{ vault_user }}"
    group: "{{ vault_group }}"
    mode: '0640'
  notify: Restart vault

- name: Flush handlers to ensure Vault is running
  ansible.builtin.meta: flush_handlers

- name: Ensure Transit Vault service is enabled and started
  ansible.builtin.systemd:
    name: vault
    state: started
    enabled: true

- name: Wait for Transit Vault port to respond
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ vault_api_port }}"
    delay: 2
    timeout: 30

- name: Check Transit Vault initialization status via HTTP API
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ vault_api_port }}/v1/sys/init"
    ca_path: "{{ vault_tls_dir }}/ca.crt"
    method: GET
    status_code: [200]
    return_content: true
  register: transit_init_check
  retries: 15
  delay: 2
  until: transit_init_check.status == 200

- name: Check Transit Vault seal status via HTTP API
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ vault_api_port }}/v1/sys/seal-status"
    ca_path: "{{ vault_tls_dir }}/ca.crt"
    method: GET
    status_code: [200]
    return_content: true
  register: transit_seal_check
  when: transit_init_check.json.initialized

# A new Transit means a new seal key. If the main cluster already exists, its data is
# sealed with the old key: re-initializing here would rewrite every node's seal token,
# restart the cluster, and leave it permanently sealed. Restore VM 500 from backup instead.
- name: Guard against re-initializing Transit under an existing cluster
  when: not transit_init_check.json.initialized
  block:
    - name: Check for bootstrap marker on main cluster nodes
      ansible.builtin.stat:
        path: "{{ hostvars[item].vault_bootstrap_marker | default('/etc/vault.d/.vault_bootstrapped') }}"
      delegate_to: "{{ item }}"
      loop: "{{ groups['vault_cluster'] }}"
      register: vault_transit_cluster_markers
      ignore_unreachable: true

    - name: Check main cluster nodes initialization via HTTP API
      ansible.builtin.uri:
        url: "https://{{ hostvars[item].ansible_host }}:{{ vault_api_port }}/v1/sys/init"
        ca_path: "{{ vault_tls_dir }}/ca.crt"
        method: GET
        status_code: [200]
        timeout: 5
      loop: "{{ groups['vault_cluster'] }}"
      register: vault_transit_cluster_init
      failed_when: false

    - name: Summarize main cluster state
      ansible.builtin.set_fact:
        vault_transit_cluster_found: >-
          {{ (vault_transit_cluster_markers.results | selectattr('stat', 'defined') | map(attribute='stat.exists') | select | list
              + vault_transit_cluster_init.results | selectattr('json', 'defined') | map(attribute='json.initialized') | select | list)
             | length > 0 }}
        vault_transit_cluster_unknown: >-
          {{ vault_transit_cluster_markers.results | selectattr('unreachable', 'defined') | selectattr('unreachable')
             | map(attribute='item') | list }}

    - name: Refuse to initialize a new Transit while the main cluster exists
      ansible.builtin.assert:
        that:
          - not (vault_transit_cluster_found | bool)
          - vault_transit_cluster_unknown | length == 0
        fail_msg: >-
          Refusing to initialize a new Transit Vault.
          {% if vault_transit_cluster_found | bool %}The main cluster is already initialized and its data is sealed
          with the existing Transit key; a new key would leave it permanently sealed.{% else %}Could not check
          {{ vault_transit_cluster_unknown | join(', ') }}, so an existing cluster cannot be ruled out.{% endif %}
          Restore vm-vault-transit (VM 500) from a Proxmox backup instead. See docs/security-operations.md section 5.

- name: Initialize Transit Vault if uninitialized
  when: not transit_init_check.json.initialized
  block:
    - name: Run operator init on Transit Vault
      ansible.builtin.command:
        cmd: "{{ vault_bin }} operator init -key-shares={{ transit_key_shares }} -key-threshold={{ transit_key_threshold }} -format=json"
      environment:
        VAULT_ADDR: "https://127.0.0.1:{{ vault_api_port }}"
        VAULT_CACERT: "{{ vault_tls_dir }}/ca.crt"
      register: transit_init_raw

    - name: Save Transit credentials to local control node
      ansible.builtin.copy:
        content: "{{ transit_init_raw.stdout }}"
        dest: "{{ vault_local_credentials_dir }}/transit_credentials.json"
        mode: '0600'
      delegate_to: localhost
      become: false

    - name: Save Transit unseal key locally on Transit node
      ansible.builtin.copy:
        content: "{{ (transit_init_raw.stdout | from_json).unseal_keys_b64[0] }}"
        dest: "{{ vault_config_dir }}/transit.key"
        owner: "{{ vault_user }}"
        group: "{{ vault_group }}"
        mode: '0600'

    - name: Unseal Transit Vault
      ansible.builtin.command:
        cmd: "{{ vault_bin }} operator unseal {{ (transit_init_raw.stdout | from_json).unseal_keys_b64[0] }}"
      environment:
        VAULT_ADDR: "https://127.0.0.1:{{ vault_api_port }}"
        VAULT_CACERT: "{{ vault_tls_dir }}/ca.crt"

    - name: Set Transit root token fact
      ansible.builtin.set_fact:
        transit_root_token: "{{ (transit_init_raw.stdout | from_json).root_token }}"

    - name: Enable Transit secrets engine
      ansible.builtin.command:
        cmd: "{{ vault_bin }} secrets enable -path=transit transit"
      environment:
        VAULT_ADDR: "https://127.0.0.1:{{ vault_api_port }}"
        VAULT_CACERT: "{{ vault_tls_dir }}/ca.crt"
        VAULT_TOKEN: "{{ transit_root_token }}"

    - name: Create Transit unseal key
      ansible.builtin.command:
        cmd: "{{ vault_bin }} write -f transit/keys/{{ transit_key_name }} type={{ transit_key_type }}"
      environment:
        VAULT_ADDR: "https://127.0.0.1:{{ vault_api_port }}"
        VAULT_CACERT: "{{ vault_tls_dir }}/ca.crt"
        VAULT_TOKEN: "{{ transit_root_token }}"

    - name: Write autounseal policy for Main Cluster
      ansible.builtin.shell: |
        {{ vault_bin }} policy write autounseal - <<'EOF'
        path "transit/encrypt/{{ transit_key_name }}" {
          capabilities = ["update"]
        }
        path "transit/decrypt/{{ transit_key_name }}" {
          capabilities = ["update"]
        }
        EOF
      environment:
        VAULT_ADDR: "https://127.0.0.1:{{ vault_api_port }}"
        VAULT_CACERT: "{{ vault_tls_dir }}/ca.crt"
        VAULT_TOKEN: "{{ transit_root_token }}"

    - name: Generate Auto-Unseal client token for Main Cluster
      ansible.builtin.command:
        cmd: "{{ vault_bin }} token create -orphan -policy=autounseal -period=768h -format=json"
      environment:
        VAULT_ADDR: "https://127.0.0.1:{{ vault_api_port }}"
        VAULT_CACERT: "{{ vault_tls_dir }}/ca.crt"
        VAULT_TOKEN: "{{ transit_root_token }}"
      register: autounseal_token_raw

    - name: Store Auto-Unseal token on control node
      ansible.builtin.copy:
        content: "{{ (autounseal_token_raw.stdout | from_json).auth.client_token }}"
        dest: "{{ vault_local_credentials_dir }}/autounseal_token.txt"
        mode: '0600'
      delegate_to: localhost
      become: false

- name: Check if Auto-Unseal token already exists on control node
  ansible.builtin.stat:
    path: "{{ vault_local_credentials_dir }}/autounseal_token.txt"
  delegate_to: localhost
  become: false
  register: existing_unseal_token_file

- name: Recover Auto-Unseal token from surviving cluster node if present
  when: transit_init_check.json.initialized and not (existing_unseal_token_file.stat.exists | default(false))
  block:
    - name: Identify surviving cluster node with valid configuration
      ansible.builtin.set_fact:
        cluster_survivor_host: >-
          {{
            (groups['vault_cluster']
            | map('extract', hostvars)
            | selectattr('is_vault_bootstrapped', 'defined')
            | selectattr('is_vault_bootstrapped', 'equalto', true)
            | map(attribute='inventory_hostname')
            | list
            | first)
            | default(vault_primary_node)
          }}

    - name: Check if vault.hcl exists on surviving cluster node
      ansible.builtin.stat:
        path: "{{ vault_config_dir }}/vault.hcl"
      delegate_to: "{{ cluster_survivor_host | default(vault_primary_node | default('vm-vault-01')) }}"
      register: survivor_vault_hcl_stat
      ignore_errors: true

    - name: Slurp surviving node vault.hcl and extract token
      when: survivor_vault_hcl_stat.stat.exists | default(false)
      block:
        - name: Read vault.hcl on surviving node
          ansible.builtin.slurp:
            src: "{{ vault_config_dir }}/vault.hcl"
          delegate_to: "{{ cluster_survivor_host | default(vault_primary_node | default('vm-vault-01')) }}"
          register: slurped_survivor_vault_hcl

        - name: Extract token regex
          ansible.builtin.set_fact:
            extracted_unseal_token: "{{ (slurped_survivor_vault_hcl.content | b64decode) | regex_search('token\\s*=\\s*\"([^\"]+)\"', '\\1') | first }}"

        - name: Write extracted Auto-Unseal token to control node
          ansible.builtin.copy:
            content: "{{ extracted_unseal_token }}"
            dest: "{{ vault_local_credentials_dir }}/autounseal_token.txt"
            mode: '0600'
          delegate_to: localhost
          become: false
          when: extracted_unseal_token is defined and extracted_unseal_token | length > 0

- name: Unseal Transit Vault if sealed
  when: transit_init_check.json.initialized and (transit_seal_check.json.sealed | default(false))
  block:
    - name: Check if local transit.key exists on node
      ansible.builtin.stat:
        path: "{{ vault_config_dir }}/transit.key"
      register: local_transit_key_stat

    - name: Unseal Transit from local key if present
      when: local_transit_key_stat.stat.exists
      block:
        - name: Read local transit.key
          ansible.builtin.slurp:
            src: "{{ vault_config_dir }}/transit.key"
          register: slurped_local_transit_key

        - name: Unseal Transit Vault via local key
          ansible.builtin.command:
            cmd: "{{ vault_bin }} operator unseal {{ slurped_local_transit_key.content | b64decode | trim }}"
          environment:
            VAULT_ADDR: "https://127.0.0.1:{{ vault_api_port }}"
            VAULT_CACERT: "{{ vault_tls_dir }}/ca.crt"

    - name: Check if transit credentials exist on control node
      ansible.builtin.stat:
        path: "{{ vault_local_credentials_dir }}/transit_credentials.json"
      delegate_to: localhost
      become: false
      register: transit_creds_stat
      when: not local_transit_key_stat.stat.exists

    - name: Unseal Transit using stored control node credentials
      when: not local_transit_key_stat.stat.exists and (transit_creds_stat.stat.exists | default(false))
      block:
        - name: Fetch stored Transit credentials
          ansible.builtin.slurp:
            src: "{{ vault_local_credentials_dir }}/transit_credentials.json"
          delegate_to: localhost
          become: false
          register: stored_transit_creds

        - name: Unseal Transit Vault
          ansible.builtin.command:
            cmd: "{{ vault_bin }} operator unseal {{ (stored_transit_creds.content | b64decode | from_json).unseal_keys_b64[0] }}"
          environment:
            VAULT_ADDR: "https://127.0.0.1:{{ vault_api_port }}"
            VAULT_CACERT: "{{ vault_tls_dir }}/ca.crt"

- name: Deploy automatic unseal systemd service on Transit node
  ansible.builtin.copy:
    dest: /etc/systemd/system/vault-transit-unseal.service
    content: |
      [Unit]
      Description=Auto-unseal Transit Vault on Boot
      After=vault.service
      Requires=vault.service

      [Service]
      Type=oneshot
      ExecStart=/bin/bash -c "sleep 2; if [ -f {{ vault_config_dir }}/transit.key ]; then {{ vault_bin }} operator unseal -address=https://127.0.0.1:{{ vault_api_port }} -ca-cert={{ vault_tls_dir }}/ca.crt $(cat {{ vault_config_dir }}/transit.key) || true; fi"
      RemainAfterExit=true

      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd daemon

- name: Enable vault-transit-unseal systemd service
  ansible.builtin.systemd:
    name: vault-transit-unseal
    enabled: true
    state: started

- name: Create bootstrap sentinel marker file for Transit node
  ansible.builtin.file:
    path: "{{ vault_bootstrap_marker | default('/etc/vault.d/.vault_bootstrapped') }}"
    state: touch
    owner: "{{ vault_user }}"
    group: "{{ vault_group }}"
    mode: '0640'

- name: Configure scheduled Transit backup
  ansible.builtin.include_tasks: backup.yaml
  when: vault_transit_backup_enabled | bool
