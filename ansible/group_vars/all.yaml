---
vault_version: "1.18.3"
vault_bin: "/usr/local/bin/vault"
vault_user: "vault"
vault_group: "vault"

vault_config_dir: "/etc/vault.d"
vault_data_dir: "/opt/vault/data"
vault_tls_dir: "/etc/vault.d/tls"
vault_log_dir: "/var/log/vault"

vault_api_port: 8200
vault_cluster_port: 8201
vault_primary_node: "vm-vault-01"

# Local artifact directory on Ansible Controller / Runner for keys and certs
vault_local_credentials_dir: "{{ lookup('env', 'CI_PROJECT_DIR') | default(playbook_dir ~ '/..', true) }}/credentials"

# PKI Configuration
pki_ca_subject: "/C=US/ST=State/L=City/O=Infrastructure/OU=Security/CN=Vault-Internal-Root-CA"
pki_cert_validity_days: 365
pki_ca_validity_days: 3650
